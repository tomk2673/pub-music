name: HRAIStudio
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  HRAIStudio:
    type: application
    platform: iOS
    sources: [HRAIStudio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.hrai.studio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "HRAI Studio records vocals and provides live headphone monitoring."
        SWIFT_VERSION: "5.0"
